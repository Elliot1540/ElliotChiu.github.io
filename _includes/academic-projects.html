<div class="project-grid">
{% assign projects = site.portfolio | sort: 'path' %}
{% for project in projects %}
<article class="project-card{% if project.image %} project-card--visual{% endif %}">
{% if project.image %}<a class="project-card-image" href="{{ project.url | relative_url }}" aria-label="{{ project.title }}"><img src="{{ project.image | relative_url }}" alt="{{ project.image_alt }}" loading="lazy"></a>{% endif %}
<div class="project-card-copy"><p class="eyebrow">{{ project.category | default: 'Research area' }}</p><h3><a href="{{ project.url | relative_url }}">{{ project.title }} <span aria-hidden="true">↗</span></a></h3><p>{{ project.excerpt | strip_html }}</p></div>
</article>
{% endfor %}
</div>
