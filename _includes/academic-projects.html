<div class="project-grid">
{% assign projects = site.portfolio | sort: 'path' %}
{% for project in projects %}
<article class="project-card">
<p class="eyebrow">{{ project.category | default: 'Research area' }}</p><h3><a href="{{ project.url | relative_url }}">{{ project.title }} <span aria-hidden="true">↗</span></a></h3><p>{{ project.excerpt | strip_html }}</p>
</article>
{% endfor %}
</div>
